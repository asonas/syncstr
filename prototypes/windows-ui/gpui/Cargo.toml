[package]
name = "toolkit-probe-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
toolkit-probe-common = { path = "../common" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "4304dec732a75505066de5ce2dbbfb2bec369498" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4304dec732a75505066de5ce2dbbfb2bec369498" }
raw-window-handle = "0.6"
unicode-segmentation = "1"
async-channel = "2"
windows = { version = "=0.62.2", features = ["Win32_Foundation"] }

[profile.release]
strip = true
