[package]
name = "syncstr-headless"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[features]
p2p = ["dep:iroh", "dep:iroh-relay", "dep:qrcode", "dep:mdns-sd", "dep:if-addrs", "dep:lofty"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
jpeg-decoder = { version = "0.3.2", default-features = false }
lofty = { version = "=0.25.4", optional = true }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"], optional = true }
iroh-relay = { version = "=1.3.0", default-features = false, features = ["server"], optional = true }
if-addrs = { version = "=0.15.0", optional = true }
qrcode = { version = "0.14.1", default-features = false, optional = true }
mdns-sd = { version = "=0.21.5", optional = true }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.9"
rcgen = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "multipart", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = true

[[example]]
name = "migration_batch"
required-features = ["p2p"]

[[example]]
name = "shared_audio_fixture"
required-features = ["p2p"]
