[package]
name = "syncstr-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
# Update both revisions together; platform initialization lives in gpui_platform.
gpui = { git = "https://github.com/zed-industries/zed", rev = "4304dec732a75505066de5ce2dbbfb2bec369498", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4304dec732a75505066de5ce2dbbfb2bec369498", default-features = false, features = ["font-kit"] }
unicode-segmentation = "1.12"

[target.'cfg(windows)'.dependencies]
anyhow = "1"
fs2 = "0.4"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syncstr-headless = { path = "../../headless", features = ["p2p"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
windows = { version = "0.62.2", features = ["Foundation", "Media_Core", "Media_Playback", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_WinRT", "Win32_System_Memory"] }

[target.'cfg(windows)'.dev-dependencies]
sha2 = "0.10"
hex = "0.4"

# ASO-56: retain the composing text rectangle when positioning Windows IME candidates.
[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }
