[package]
name = "syncstr-android"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
jni = "=0.21.1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
syncstr-headless = { path = "../../../headless", features = ["p2p"] }
