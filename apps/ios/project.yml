name: Syncstr
packages:
  IrohLib:
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
  AudioTags:
    path: ../macos/AudioTags
options:
  bundleIdPrefix: as.ason.syncstr
  deploymentTarget:
    iOS: "27.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QYP65434UW
targets:
  SyncstrMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/PhonePlayback.swift
      - path: ../macos/Syncstr.swift
      - path: ../macos/LocalCatalog.swift
      - path: ../macos/CatalogDatabase.swift
      - path: ../macos/ClusterPersistence.swift
      - path: ../macos/ClusterMembership.swift
      - path: ../macos/ClusterChanges.swift
      - path: ../macos/ClusterDiscovery.swift
      - path: ../macos/ClusterTransport.swift
      - path: ../macos/LocalTransfer.swift
      - path: ../macos/PeerTransfer.swift
      - path: ../macos/PeerSetup.swift
      - path: ../macos/LocalSetup.swift
      - path: ../macos/Library.swift
      - path: ../macos/PlaybackCache.swift
      - path: ../macos/PlaybackDiagnostics.swift
      - path: ../macos/OfflineSaves.swift
      - path: ../macos/PlaybackCommands.swift
      - path: ../macos/AlbumOrganization.swift
      - path: ../macos/AlbumMembership.swift
      - path: ../macos/AlbumArtwork.swift
      - path: ../macos/ArtworkAcquisition.swift
      - path: ../macos/Track.swift
      - path: ../macos/CredentialStore.swift
      - path: ../macos/Licenses
        buildPhase: resources
      - path: ../macos/SettingsView.swift
      - path: ../macos/Assets.xcassets
    dependencies:
      - sdk: iTunesLibrary.framework
      - package: IrohLib
      - package: AudioTags
    settings:
      base:
        PRODUCT_NAME: Syncstr
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: as.ason.syncstr.ios
        TARGETED_DEVICE_FAMILY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ../macos/Syncstr.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: ../macos/TestFlight-Info.plist
      properties:
        CFBundleLocalizations: [ja, en]
        NSAppleMusicUsageDescription: "Musicライブラリから音源に対応するアートワークを読み込むために使用します。"
        CFBundleDisplayName: Syncstr
        NSLocalNetworkUsageDescription: "MacとiPhoneの間で音楽を転送するために使用します。"
        NSBonjourServices: ["_syncstr-music._tcp", "_syncstr-cluster._udp"]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
  Syncstr:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Licenses
        buildPhase: resources
      - path: ../macos/LocalCatalog.swift
      - path: ../macos/CatalogDatabase.swift
      - path: ../macos/ClusterPersistence.swift
      - path: ../macos/ClusterMembership.swift
      - path: ../macos/ClusterChanges.swift
      - path: ../macos/ClusterDiscovery.swift
      - path: ../macos/ClusterTransport.swift
      - path: ../macos/LocalTransfer.swift
      - path: ../macos/PeerTransfer.swift
      - path: ../macos/PeerSetup.swift
      - path: ../macos/LocalSetup.swift
      - path: ../macos/Library.swift
      - path: ../macos/PlaybackCache.swift
      - path: ../macos/PlaybackDiagnostics.swift
      - path: ../macos/OfflineSaves.swift
      - path: ../macos/PlaybackCommands.swift
      - path: ../macos/AlbumOrganization.swift
      - path: ../macos/AlbumMembership.swift
      - path: ../macos/AlbumArtwork.swift
      - path: ../macos/ArtworkAcquisition.swift
      - path: ../macos/Track.swift
      - path: ../macos/CredentialStore.swift
    dependencies:
      - package: IrohLib
      - package: AudioTags
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: as.ason.syncstr.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Syncstr
        NSLocalNetworkUsageDescription: "MacとiPhoneの間で音楽を転送するために使用します。"
        NSBonjourServices: ["_syncstr-music._tcp", "_syncstr-cluster._udp"]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "接続先のペアリング用QRコードを読み取るために使用します。"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
  SyncstrUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Syncstr
    dependencies:
      - target: Syncstr
  SyncstrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../macos/Tests/PlayerInteractionTests.swift
      - path: ../macos/Tests/OfflineSaveTests.swift
      - path: ../macos/Tests/SavePreparationTests.swift
      - path: ../macos/Tests/LibraryPresentationTests.swift
      - path: ../macos/Tests/AlbumOrganizationTests.swift
      - path: ../macos/Tests/AlbumArtworkTests.swift
      - path: ../macos/Tests/CatalogMigrationTests.swift
      - path: ../macos/Tests/ClusterPersistenceTests.swift
      - path: ../macos/Tests/ClusterMembershipTests.swift
      - path: ../../headless/fixtures/cluster-signed.json
        buildPhase: resources
      - path: ../../headless/fixtures/compilation-membership.json
        buildPhase: resources
      - path: ../../headless/fixtures/album-artwork.json
        buildPhase: resources
      - path: ../../headless/fixtures/album-organization.json
        buildPhase: resources
      - path: ../../headless/fixtures/local-entry.json
        buildPhase: resources
      - path: ../../headless/fixtures/cluster-state.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Syncstr
  LocalMusicTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../macos/Library.swift
      - path: ../macos/PlaybackCache.swift
      - path: ../macos/PlaybackDiagnostics.swift
      - path: ../macos/OfflineSaves.swift
      - path: ../macos/Tests
      - path: ../../headless/fixtures/cluster-signed.json
        buildPhase: resources
      - path: ../../headless/fixtures/compilation-membership.json
        buildPhase: resources
      - path: ../../headless/fixtures/album-artwork.json
        buildPhase: resources
      - path: ../../headless/fixtures/album-organization.json
        buildPhase: resources
      - path: ../../headless/fixtures/local-entry.json
        buildPhase: resources
      - path: ../../headless/fixtures/cluster-state.json
        buildPhase: resources
      - path: ../macos/LocalCatalog.swift
      - path: ../macos/CatalogDatabase.swift
      - path: ../macos/ClusterPersistence.swift
      - path: ../macos/ClusterMembership.swift
      - path: ../macos/ClusterChanges.swift
      - path: ../macos/ClusterDiscovery.swift
      - path: ../macos/ClusterTransport.swift
      - path: ../macos/LocalTransfer.swift
      - path: ../macos/PeerTransfer.swift
      - path: ../macos/AlbumOrganization.swift
      - path: ../macos/AlbumMembership.swift
      - path: ../macos/AlbumArtwork.swift
      - path: ../macos/ArtworkAcquisition.swift
      - path: ../macos/Track.swift
      - path: ../macos/CredentialStore.swift
    dependencies:
      - sdk: iTunesLibrary.framework
      - package: IrohLib
      - package: AudioTags
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LibraryCheck:
    type: tool
    platform: macOS
    sources:
      - path: ../macos/LibraryCheck.swift
      - path: ../macos/Library.swift
      - path: ../macos/PlaybackCache.swift
      - path: ../macos/PlaybackDiagnostics.swift
      - path: ../macos/OfflineSaves.swift
      - path: ../macos/LocalCatalog.swift
      - path: ../macos/CatalogDatabase.swift
      - path: ../macos/ClusterPersistence.swift
      - path: ../macos/ClusterMembership.swift
      - path: ../macos/ClusterChanges.swift
      - path: ../macos/ClusterDiscovery.swift
      - path: ../macos/ClusterTransport.swift
      - path: ../macos/LocalTransfer.swift
      - path: ../macos/PeerTransfer.swift
      - path: ../macos/AlbumOrganization.swift
      - path: ../macos/AlbumMembership.swift
      - path: ../macos/AlbumArtwork.swift
      - path: ../macos/ArtworkAcquisition.swift
      - path: ../macos/Track.swift
      - path: ../macos/CredentialStore.swift
    dependencies:
      - sdk: iTunesLibrary.framework
      - package: IrohLib
      - package: AudioTags
schemes:
  LibraryCheck:
    build:
      targets:
        LibraryCheck: all
  SyncstrMac:
    build:
      targets:
        SyncstrMac: all
    archive:
      config: Release
    test:
      targets: [LocalMusicTests]
  Syncstr:
    build:
      targets:
        Syncstr: all
    test:
      targets: [SyncstrTests]
