name: Syncstr
packages:
  AudioTags:
    path: ../macos/AudioTags
options:
  bundleIdPrefix: as.ason.syncstr
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QYP65434UW
targets:
  SyncstrMac:
    type: application
    platform: macOS
    sources:
      - path: ../macos/Syncstr.swift
      - path: ../macos/Library.swift
      - path: ../macos/Navidrome.swift
      - path: ../macos/CredentialStore.swift
      - path: ../macos/Upload.swift
      - path: ../macos/UploadView.swift
      - path: ../macos/MusicMetadata.swift
      - path: ../macos/MetadataEditor.swift
      - path: ../macos/Licenses
        buildPhase: resources
      - path: ../macos/UploadSettingsView.swift
      - path: ../macos/SettingsView.swift
      - path: ../macos/Assets.xcassets
    dependencies:
      - package: AudioTags
    settings:
      base:
        PRODUCT_NAME: Syncstr
        PRODUCT_BUNDLE_IDENTIFIER: as.ason.syncstr.ios
        TARGETED_DEVICE_FAMILY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: MacAppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: ../macos/Syncstr.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: ../macos/TestFlight-Info.plist
      properties:
        CFBundleLocalizations: [ja, en]
        CFBundleDisplayName: syncstr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.music
  Syncstr:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Licenses
        buildPhase: resources
      - path: ../macos/Library.swift
      - path: ../macos/Navidrome.swift
      - path: ../macos/CredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: as.ason.syncstr.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: syncstr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [audio]
  SyncstrTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Syncstr
  MusicMetadataTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ../macos/Tests
      - path: ../macos/MusicMetadata.swift
      - path: ../macos/Upload.swift
    dependencies:
      - package: AudioTags
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SyncstrMac:
    build:
      targets:
        SyncstrMac: all
    archive:
      config: Release
    test:
      targets: [MusicMetadataTests]
  Syncstr:
    build:
      targets:
        Syncstr: all
    test:
      targets: [SyncstrTests]
