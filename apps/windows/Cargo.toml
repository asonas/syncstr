[package]
name = "syncstr-windows"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
rand = "0.9"
serde_json = "1"
syncstr-headless = { path = "../../headless", features = ["p2p"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tempfile = "3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
