name: Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      headless: ${{ steps.paths.outputs.headless }}
      macos: ${{ steps.paths.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect job inputs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Shared Rust sources and fixtures also build the Apple interoperability tools.
          shared=(headless/ contracts/ fixtures/ Cargo.toml Cargo.lock rust-toolchain rust-toolchain.toml .cargo/ .github/workflows/)
          headless_paths=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- "${shared[@]}" apps/ios/scripts/ apps/macos/Tests/Fixtures/)
          macos_paths=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" -- "${shared[@]}" apps/macos/ apps/ios/)
          if [[ -n "$headless_paths" ]]; then
            echo "headless=true" >> "$GITHUB_OUTPUT"
          else
            echo "headless=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$macos_paths" ]]; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi
  headless:
    needs: changes
    # Non-PR events must run even though changes is skipped; detection failures fail closed.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.headless == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        working-directory: headless
    steps:
      - uses: actions/checkout@v7
      - name: Simulator runner and reporting regression tests
        working-directory: .
        run: python3 -m unittest discover -s apps/ios/scripts/tests -v
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Cache headless Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            headless/target
          key: headless-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('headless/Cargo.lock') }}
          restore-keys: headless-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      # Every test target runs, so new files need no list; lan_process is #[ignore]d.
      - name: Regression tests
        run: cargo +1.99.1 test --locked --features p2p --tests
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --features p2p --lib -- -D warnings
  macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.macos == 'true') }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      # Both legacy and v5 Apple interoperability tests require this binary.
      TEST_RUNNER_SYNCSTR_V5_TEST_BIN_DIR: ${{ github.workspace }}/.build/v5-rust/debug
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate --spec apps/ios/project.yml
      - name: Cache interoperability Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/v5-rust
          key: macos-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('headless/Cargo.lock') }}
          restore-keys: macos-fixtures-v1-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Identify Swift toolchain
        id: swift
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache locked Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/MacDerivedData/SourcePackages
          key: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
          restore-keys: swift-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-
      - name: Cache locked Iroh binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cache="$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          cached_archive="$cache/https___github_com_n0_computer_iroh_ffi_releases_download_v1_1_0_IrohLib_xcframework_zip"
          if [ -f "$cached_archive" ]; then
            printf '%s  %s\n' ad46dadf09f9224157512992923562931ed60f252414230d50893a4d515c5776 "$cached_archive" \
              | shasum -a 256 --check && exit 0
          fi
          # Use the release API when the browser download endpoint returns 504.
          gh release download v1.1.0 --repo n0-computer/iroh-ffi \
            --pattern IrohLib.xcframework.zip --dir "$RUNNER_TEMP/iroh-binary"
          archive="$RUNNER_TEMP/iroh-binary/IrohLib.xcframework.zip"
          # Pinned by the upstream v1.1.0 Package.swift; SwiftPM checks it again.
          printf '%s  %s\n' ad46dadf09f9224157512992923562931ed60f252414230d50893a4d515c5776 "$archive" \
            | shasum -a 256 --check
          mkdir -p "$cache"
          command cp "$archive" "$cached_archive"
      - name: Cache compiled Swift packages
        uses: actions/cache@v4
        with:
          # Retain dependency products, not application or test binaries.
          path: |
            .build/MacDerivedData/Build/Intermediates.noindex/IrohLib.build
            .build/MacDerivedData/Build/Intermediates.noindex/ExplicitPrecompiledModules
            .build/MacDerivedData/Build/Intermediates.noindex/SwiftExplicitPrecompiledModules
            .build/MacDerivedData/Build/Products/Debug/IrohLib*
            .build/MacDerivedData/Build/Products/Debug/PackageFrameworks
            .build/MacDerivedData/SDKExplicitPrecompiledModules
          key: swift-products-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('apps/ios/**/Package.resolved') }}
      - name: Resolve locked packages
        run: |
          # GitHub release assets can return transient gateway errors.
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies -project apps/ios/Syncstr.xcodeproj \
              -scheme SyncstrMac -derivedDataPath .build/MacDerivedData \
              -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile; then
              exit 0
            else
              result=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$result"
            fi
            sleep 10
          done
      - name: Build macOS tests and interoperability tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          # Swift compilation does not need the Rust fixtures; test execution does.
          cargo +1.99.1 build --manifest-path headless/Cargo.toml --locked --features p2p --target-dir .build/v5-rust --bin syncstr-headless --example shared_audio_fixture --example shared_audio_fixture_update &
          fixture_build=$!
          trap 'kill "$fixture_build" 2>/dev/null || true' EXIT
          xcodebuild -project apps/ios/Syncstr.xcodeproj -scheme SyncstrMac \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -destination 'platform=macOS' -derivedDataPath .build/MacDerivedData \
            CODE_SIGNING_ALLOWED=NO build-for-testing
          wait "$fixture_build"
          trap - EXIT
      - name: macOS regression tests
        run: >-
          xcodebuild -project apps/ios/Syncstr.xcodeproj -scheme SyncstrMac
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          -destination 'platform=macOS' -derivedDataPath .build/MacDerivedData
          -resultBundlePath .build/mac-tests.xcresult CODE_SIGNING_ALLOWED=NO test-without-building
          '-skip-testing:LocalMusicTests/LibraryPresentationTests/testSelectionAndPlaybackUpdatesBrowseRetainedCatalogWithoutBlocking()'
      - name: Isolated macOS responsiveness test
        run: >-
          xcodebuild -project apps/ios/Syncstr.xcodeproj -scheme SyncstrMac
          -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          -destination 'platform=macOS' -derivedDataPath .build/MacDerivedData
          -resultBundlePath .build/mac-responsiveness.xcresult CODE_SIGNING_ALLOWED=NO test-without-building
          '-only-testing:LocalMusicTests/LibraryPresentationTests/testSelectionAndPlaybackUpdatesBrowseRetainedCatalogWithoutBlocking()'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-tests
          path: |
            .build/mac-tests.xcresult
            .build/mac-responsiveness.xcresult
          retention-days: 7
