name: ASO-93 temporary reporting acceptance
on:
  push:
    branches: [agent/aso-93-weekly-simulator]
    paths: [.github/workflows/aso93-report-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: weekly-simulator-report-acceptance
  cancel-in-progress: false
jobs:
  injected-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Deliberately fail before Simulator results
        run: exit 1
      - name: Collect injected failure
        if: always()
        run: |
          python3 apps/ios/scripts/report_simulator.py collect --device iphone --outcome failure --root .build/verification/iphone
          python3 apps/ios/scripts/report_simulator.py collect --device ipad --outcome failure --root .build/verification/ipad
      - name: Exercise real Linear OAuth and notification
        if: always()
        env:
          LINEAR_CLIENT_ID: ${{ secrets.LINEAR_CLIENT_ID }}
          LINEAR_CLIENT_SECRET: ${{ secrets.LINEAR_CLIENT_SECRET }}
        run: python3 apps/ios/scripts/report_simulator.py notify --outcome failure
