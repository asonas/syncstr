name: LAN verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: headless
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Real multicast discovery and replication
        shell: bash
        run: >-
          cargo +1.99.1 test --locked --features p2p --test lan_process
          -- --test-threads=1 --nocapture 2>&1 | tee lan-verification.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lan-${{ matrix.runner }}
          path: headless/lan-verification.log
          retention-days: 7
