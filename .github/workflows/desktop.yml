name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain
      - rust-toolchain.toml
      - .github/workflows/**
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Incremental compiler state is large and not portable between runner checkouts.
  CARGO_INCREMENTAL: '0'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Cache desktop Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-v2-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-v2-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Build
        run: cargo +1.99.1 build --locked
      - name: Test
        run: cargo +1.99.1 test --locked
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Cache desktop Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-v2-${{ runner.os }}-${{ runner.arch }}-1.99.1-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-v2-${{ runner.os }}-${{ runner.arch }}-1.99.1-
      - name: Build
        run: cargo +1.99.1 build --locked
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
