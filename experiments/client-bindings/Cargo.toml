[package]
name = "syncstr_binding_probe"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
fs2 = "0.4"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin.rs"
