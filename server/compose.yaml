services:
  upload:
    build: .
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    ports:
      - "127.0.0.1:4545:4545"
    environment:
      SYNCSTR_TOKEN_FILE: /run/secrets/upload_token
      SYNCSTR_MUSIC_DIR: /storage/music
      SYNCSTR_STAGING_DIR: /storage/staging
    volumes:
      - /mnt/data/syncstr/music:/storage/music
      - /mnt/data/syncstr/upload-staging:/storage/staging
    secrets:
      - upload_token
secrets:
  upload_token:
    file: ./secrets/upload-token
